<div class="overlay" *ngIf="open" (click)="onOverlayClick()">
  <div class="modal" (click)="stop($event)">
    <div class="modal-top">
      <div>
        <h3>{{ title }}</h3>
      </div>

      <button class="icon-btn" type="button" (click)="onCancel()" aria-label="Cerrar">
        ✕
      </button>
    </div>

    <div class="modal-body">
      <!-- ✅ mensaje normal -->
      <p class="message" *ngIf="!reprogram">{{ message }}</p>

      <!-- ✅ modo reprogramar -->
      <div class="reprogram-form" *ngIf="reprogram">
        <p class="message">{{ message }}</p>

        <label class="rf-label">Nueva fecha</label>
        <input
          class="rf-input"
          type="date"
          [min]="reprogramMinDate"
          [value]="reprogramDate"
          (input)="onReprogramDateInput(($any($event.target)).value)"
        />

        <label class="rf-label">Nueva hora</label>
        <input
          class="rf-input"
          type="time"
          [value]="reprogramTime"
          (input)="onReprogramTimeInput(($any($event.target)).value)"
        />

        <div class="rf-hint">
          * Por ahora podés elegir cualquier hora. Después lo conectamos con disponibilidad real.
        </div>
      </div>

      <div class="error" *ngIf="error">
        {{ error }}
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn-ghost" type="button" (click)="onCancel()" [disabled]="loading">
        {{ cancelText }}
      </button>

      <button class="btn-primary" type="button" (click)="onConfirm()" [disabled]="loading">
        {{ loading ? 'Procesando…' : confirmText }}
      </button>
    </div>
  </div>
</div>
