<div class="step-title">Usuario administrador</div>

<div class="field">
  <div class="label-row">
    <label>Nombre y apellido</label>
    <span class="label-error" *ngIf="group.get('fullName')?.touched && group.get('fullName')?.invalid">
      Obligatorio
    </span>
  </div>

  <input
    class="pill-input"
    type="text"
    formControlName="fullName"
    placeholder="Nombre Apellido"
    maxlength="80"
  />
</div>

<div class="grid section-gap">
  <div class="field">
    <div class="label-row">
      <label>Email institucional</label>
      <span class="label-error" *ngIf="group.get('email')?.touched && group.get('email')?.invalid">
        Email inválido
      </span>
    </div>

    <input
      class="pill-input"
      type="email"
      formControlName="email"
      placeholder="admin@hospital.com"
      maxlength="120"
    />
  </div>

  <div class="field">
    <div class="label-row">
      <label>Teléfono</label>
      <span class="label-error" *ngIf="group.get('phone')?.touched && group.get('phone')?.invalid">
        Teléfono inválido
      </span>
    </div>

    <input
      class="pill-input"
      type="tel"
      formControlName="phone"
      placeholder="+54 11 1234 5678"
      maxlength="20"
      (input)="onPhoneInput($event)"
    />
  </div>
</div>

<div class="grid section-gap">
  <div class="field">
    <div class="label-row">
      <label>Contraseña</label>
      <span class="label-error" *ngIf="group.get('password')?.touched && group.get('password')?.invalid">
        Mínimo 8
      </span>
    </div>

    <div class="pw-row">
      <input
        class="pill-input"
        [type]="showPw ? 'text' : 'password'"
        formControlName="password"
        placeholder="Mínimo 8 caracteres"
        maxlength="64"
      />

      <button type="button" class="eye" (click)="togglePw()" aria-label="Ver u ocultar contraseña">
        <span class="eye-icon" [class.eye-icon--off]="showPw">&#128065;</span>
      </button>
    </div>
  </div>

  <div class="field">
    <div class="label-row">
      <label>Confirmar contraseña</label>
      <span class="label-error" *ngIf="group.get('confirmPassword')?.touched && group.get('confirmPassword')?.invalid">
        Obligatorio
      </span>
    </div>

    <div class="pw-row">
      <input
        class="pill-input"
        [type]="showCpw ? 'text' : 'password'"
        formControlName="confirmPassword"
        placeholder="Repetí la contraseña"
        maxlength="64"
      />

      <button type="button" class="eye" (click)="toggleCpw()" aria-label="Ver u ocultar contraseña">
        <span class="eye-icon" [class.eye-icon--off]="showCpw">&#128065;</span>
      </button>
    </div>

    <div class="match ok" *ngIf="group.get('confirmPassword')?.touched && pwMatch">
      Las contraseñas coinciden
    </div>
    <div class="match bad" *ngIf="group.get('confirmPassword')?.touched && pwMismatch">
      Las contraseñas no coinciden
    </div>
  </div>
</div>
