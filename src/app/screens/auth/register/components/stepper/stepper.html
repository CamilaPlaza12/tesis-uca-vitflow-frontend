<nav class="stepper" aria-label="Progreso de registro">
  <div class="stepper-track">
    <ng-container *ngFor="let s of steps; let i = index">
      <div
        class="step"
        [class.step--active]="i === activeIndex"
        [class.step--done]="i < activeIndex"
        [attr.aria-current]="i === activeIndex ? 'step' : null"
      >
        <div class="dot">{{ i + 1 }}</div>
        <div class="label">{{ s.label }}</div>
      </div>

      <!-- Flecha entre pasos (no al final) -->
      <div class="arrow" *ngIf="i < steps.length - 1" aria-hidden="true">
        →
      </div>
    </ng-container>
  </div>
</nav>
