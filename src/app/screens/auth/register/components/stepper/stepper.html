<div class="stepper" role="list">
  <div class="step" role="listitem" *ngFor="let s of steps; let i = index">
    <div class="dot" [class.dot--active]="i === activeIndex" [class.dot--done]="i < activeIndex">
      {{ i + 1 }}
    </div>

    <div class="label" [class.label--active]="i === activeIndex" [class.label--done]="i < activeIndex">
      {{ s.label }}
    </div>

    <div class="arrow" *ngIf="i < steps.length - 1" aria-hidden="true">→</div>
  </div>
</div>
