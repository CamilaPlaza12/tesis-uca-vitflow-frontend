<div class="stepper" role="progressbar" aria-label="Progreso de registro">
  <ng-container *ngFor="let s of steps; let i = index">
    <div
      class="step"
      [class.step--active]="i === activeIndex"
      [class.step--done]="i < activeIndex"
    >
      <div class="dot">{{ i + 1 }}</div>
      <div class="label">{{ s.label }}</div>
    </div>

    <div class="arrow" *ngIf="i < steps.length - 1" aria-hidden="true">›</div>
  </ng-container>
</div>
