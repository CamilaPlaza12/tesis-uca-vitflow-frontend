<div class="auth-page">
  <div class="auth-card auth-card--single">
    <div class="auth-card__single">
      <div class="brand">
        <img src="/images/logo.png" alt="VitFlow" class="brand-logo" />
        <div class="brand-text">
          <h1>VitFlow</h1>
        </div>
      </div>

      <div class="header">
        <h2 class="title">Creá tu cuenta institucional</h2>
        <p class="subtitle">
          Registrá tu hospital, creá el usuario administrador y elegí un plan.
        </p>
      </div>

      <app-register-wizard></app-register-wizard>

      <div class="extra-links">
        <div class="link-secondary">
          <span>¿Ya tenés usuario?</span>
          <a class="link" routerLink="/signin">Volver a iniciar sesión</a>
        </div>
      </div>
    </div>
  </div>
</div>
