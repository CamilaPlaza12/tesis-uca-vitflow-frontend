<div *ngIf="errorMsg" class="error-msg">{{ errorMsg }}</div>
<div *ngIf="saving" class="saving-msg">Guardando…</div>
<section class="bancos-page" *ngIf="!loading && bloodBank">

  <header class="page-header">
    <div>
      <h1>Bancos de Sangre</h1>
      <p>Stock en tiempo real por grupo sanguíneo y factor Rh</p>
    </div>

    <span class="hint">Actualizado hoy</span>
  </header>

  <div class="top-grid">
    <app-blood-stock-chart
      [stocks]="bloodBank.stocks_ml"
      [thresholds]="bloodBank.thresholds_ml">
    </app-blood-stock-chart>

    <app-blood-manual-actions
      [stocks]="bloodBank.stocks_ml"
      (applyChange)="onManualChange($event)">
    </app-blood-manual-actions>
  </div>

  <app-blood-threshold-table
  [stocks]="bloodBank.stocks_ml"
  [thresholds]="bloodBank.thresholds_ml"
  (thresholdChange)="onThresholdChange($event)"
></app-blood-threshold-table>

</section>
