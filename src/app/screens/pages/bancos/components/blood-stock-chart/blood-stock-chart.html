<div class="card" #hostEl>
  <div class="card__header">
    <h2>Stock actual</h2>
    <span class="hint">Barras según umbral</span>
  </div>

  <div class="chart-wrap">
    <p-chart #chart type="bar" [data]="chartData" [options]="chartOptions"></p-chart>
  </div>

  <div class="legend">
    <div class="pill pill--ok">OK</div>
    <div class="pill pill--warn">Bajo</div>
    <div class="pill pill--bad">Crítico</div>
  </div>
</div>
