<div class="card">
  <div class="card__head">
    <div class="card__title">{{ title }}</div>
  </div>

  <div class="card__body">
    <table class="table">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Hora</th>
          <th>Donación</th>
          <th>Grupo</th>
          <th class="t-center">Estado</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let r of rows">
          <td class="mono">
            <span *ngIf="r.date_local">{{ formatAppointmentDate(r.date_local) }}</span>
            <span
              *ngIf="dayLabel(r.date_local) as label"
              class="day-badge"
              [class.day-badge--hoy]="label === 'hoy'"
              [class.day-badge--manana]="label === 'manana'"
            >{{ label === 'hoy' ? 'Hoy' : 'Mañana' }}</span>
          </td>
          <td class="mono">{{ r.time_local }}</td>
          <td>{{ r.donation_type }}</td>
          <td class="mono">{{ r.blood_group || '—' }}</td>
          <td class="t-center">
            <app-pill-badge
              [text]="r.status"
              [tone]="toneForStatus(r.status)"
            ></app-pill-badge>
          </td>
        </tr>

        <tr *ngIf="rows.length === 0">
          <td colspan="5" class="empty">No hay turnos para mostrar</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
