<div class="card">
  <div class="card__head">
    <div class="card__title">{{ title }}</div>
  </div>

  <div class="card__body">
    <table class="table">
      <thead>
        <tr>
          <th>Hora</th>
          <th>Donación</th>
          <th class="t-center">Estado</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let r of rows">
          <td class="mono">{{ r.time_local }}</td>
          <td>{{ r.donation_type }}</td>
          <td class="t-center">
            <app-pill-badge
              [text]="r.status"
              [tone]="toneForStatus(r.status)"
            ></app-pill-badge>
          </td>
        </tr>

        <tr *ngIf="rows.length === 0">
          <td colspan="3" class="empty">No hay turnos para mostrar</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
