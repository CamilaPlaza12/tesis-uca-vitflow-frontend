<div class="page">
  <header class="header">
    <div class="header__left">
      <h1>Turnos de donación</h1>

      <div class="subtitle-row">
        <p>Controlá la agenda de donaciones del hospital.</p>

        <!-- Lapicito solo cuando NO es onboarding -->
        <button
          *ngIf="!availabilityLoading && showAgenda"
          class="edit-icon"
          type="button"
          title="Editar disponibilidad"
          aria-label="Editar disponibilidad"
          (click)="openConfigFromEdit()"
        >
          <span class="edit-glyph">✎</span>
        </button>
      </div>
    </div>

    <div class="header__right">
      <div class="date">Hoy – {{ today | date: 'dd/MM/yyyy' }}</div>
    </div>
  </header>

  <!-- LOADING DISPONIBILIDAD -->
  <section class="availability-loading" *ngIf="availabilityLoading">
    <div class="loading-box">Cargando disponibilidad…</div>
  </section>

  <!-- ONBOARDING (vacío) -->
  <section class="onboarding" *ngIf="!availabilityLoading && showOnboarding">
    <app-availability-empty-state
      [open]="availabilityConfigOpen"
      (configure)="openConfigFromOnboarding()"
    ></app-availability-empty-state>

    <!-- ✅ CONFIG ABAJO DEL ONBOARDING -->
    <div #availabilityAnchor class="availability-anchor"></div>

    <div class="config-inline" [class.is-open]="availabilityConfigOpen">
      <app-availability-config
        *ngIf="availabilityConfigOpen || availabilityConfigClosing"
        [initial]="disponibilidad"
        [saving]="availabilitySaving"
        [errorMsg]="availabilitySaveError"
        (save)="onSaveDisponibilidad($event)"
        (cancel)="onCancelConfigurar()"
      ></app-availability-config>
    </div>
  </section>

  <!-- AGENDA (cuando ya hay disponibilidad) -->
  <section *ngIf="!availabilityLoading && showAgenda">
    <section class="turnos-shell">
      <section class="top" [class.with-detail]="!!turnoSeleccionado">
        <div class="calendar-col">
          <app-turnos-calendar
            [turnos]="turnos"
            [selectedDate]="today"
            (selectTurno)="onSelectTurnoFromCalendar($event)"
          ></app-turnos-calendar>

          <div class="empty-detail" *ngIf="!turnoSeleccionado">
            Seleccioná un turno para ver el detalle.
          </div>
        </div>

        <div class="detail-col" *ngIf="turnoSeleccionado as t">
          <app-turno-detail
            [turno]="t"
            (close)="turnoSeleccionado = null"
            (action)="requestAction($event, t)"
          ></app-turno-detail>
        </div>
      </section>

      <section class="bottom">
        <app-turnos-table
          [turnos]="turnosHistorico"
          (search)="onSearchHistorico($event)"
          (clearFilters)="onClearHistorico()"
        ></app-turnos-table>
      </section>

      <!-- ✅ CONFIG ABAJO DE TODO (como lo tenías) -->
      <section class="availability-bottom">
        <div class="availability-bottom__head">
          <div class="availability-bottom__title">Horarios de atención</div>
          <button class="edit-icon" type="button" (click)="openConfigFromEdit()">
            <span class="edit-glyph">✎</span>
          </button>
        </div>

        <div #availabilityAnchor class="availability-anchor"></div>

        <div class="config-inline" [class.is-open]="availabilityConfigOpen">
          <app-availability-config
            *ngIf="availabilityConfigOpen || availabilityConfigClosing"
            [initial]="disponibilidad"
            [saving]="availabilitySaving"
            [errorMsg]="availabilitySaveError"
            (save)="onSaveDisponibilidad($event)"
            (cancel)="onCancelConfigurar()"
          ></app-availability-config>
        </div>
      </section>
    </section>
  </section>

  <app-confirm-modal
    [open]="modalOpen"
    [title]="modalTitle"
    [message]="modalMessage"
    [confirmText]="modalConfirmText"
    [loading]="modalLoading"
    [error]="modalError"
    [reprogram]="isReprogramAction"
    [reprogramDate]="reprogramDate"
    [reprogramTime]="reprogramTime"
    [reprogramMinDate]="reprogramMinDate"
    (reprogramDateChange)="reprogramDate = $event"
    (reprogramTimeChange)="reprogramTime = $event"
    (confirm)="confirmModal()"
    (cancel)="closeModal()"
  ></app-confirm-modal>
</div>
